<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PawPeer – Sign in</title>
  <style>
    :root {
      color-scheme: light;
      --primary: #E05C00;
      --primary-bright: #F47A1F;
      --peach: #FFD080;
      --cream: #FFF5E8;
      --surface: #FFFFFF;
      --border: #FFE4BC;
      --text: #3A1E00;
      --muted: #8B6914;
      --error: #B42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 14% 10%, rgba(255, 208, 128, .55), transparent 30%),
        radial-gradient(circle at 86% 88%, rgba(244, 122, 31, .18), transparent 34%),
        var(--cream);
      color: var(--text);
      padding: 22px;
    }
    .shell {
      width: min(100%, 400px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 34px 26px 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 245, 232, .96));
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 24px 70px rgba(58, 30, 0, .14);
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .brand img {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, .82);
      box-shadow: 0 16px 32px rgba(224, 92, 0, .22);
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .lead { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.45; }
    form { display: flex; flex-direction: column; gap: 14px; }
    form[hidden] { display: none; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; font-weight: 600; }
    input {
      font: inherit;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary-bright); outline-offset: 1px; }
    button {
      font: inherit;
      font-weight: 700;
      padding: 13px 16px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-bright));
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    .link {
      background: none;
      padding: 0;
      color: var(--primary);
      font-weight: 600;
      font-size: .88rem;
      text-decoration: underline;
    }
    .msg { margin: 0; font-size: .9rem; text-align: center; min-height: 1.2em; }
    .msg.error { color: var(--error); }
    footer { text-align: center; font-size: .8rem; color: var(--muted); }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <img src="/assets/app-icon.png" alt="PawPeer app icon" />
      <h1 id="title">Sign in to PawPeer</h1>
      <p class="lead" id="lead">This site is private. Sign in with the account you were invited with.</p>
    </section>

    <form id="login-form">
      <label>Email <input type="email" name="email" autocomplete="username" required /></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required /></label>
      <button type="submit">Sign in</button>
      <button type="button" class="link" id="show-forgot">Forgot your password?</button>
    </form>

    <form id="forgot-form" hidden>
      <label>Email <input type="email" name="email" autocomplete="username" required /></label>
      <button type="submit">Send reset link</button>
      <button type="button" class="link" id="show-login">Back to sign in</button>
    </form>

    <form id="password-form" hidden>
      <label>New password <input type="password" name="password" autocomplete="new-password" minlength="8" required /></label>
      <button type="submit">Save password</button>
    </form>

    <form id="no-access" hidden>
      <button type="submit">Sign out</button>
    </form>

    <p class="msg" id="msg" role="status"></p>

    <footer>
      <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a>
    </footer>
  </main>

  <script type="module">
    import {
      login, logout, getUser, refreshSession, handleAuthCallback,
      acceptInvite, updateUser, requestPasswordRecovery, AuthError, MissingIdentityError
    } from "https://esm.sh/@netlify/identity@2.0.0";

    // Must match the roles allowed in _redirects.
    var ALLOWED_ROLES = ["member", "admin"];
    var RELOAD_KEY = "pawpeer-auth-reload";

    var forms = {
      login: document.getElementById("login-form"),
      forgot: document.getElementById("forgot-form"),
      password: document.getElementById("password-form"),
      noAccess: document.getElementById("no-access")
    };
    var title = document.getElementById("title");
    var lead = document.getElementById("lead");
    var msg = document.getElementById("msg");
    var inviteToken = null;

    function show(name, heading, text) {
      Object.keys(forms).forEach(function (key) { forms[key].hidden = key !== name; });
      if (heading) title.textContent = heading;
      if (text) lead.textContent = text;
    }

    function say(text, isError) {
      msg.textContent = text || "";
      msg.className = isError ? "msg error" : "msg";
    }

    function hasAccess(user) {
      var roles = (user && user.roles) || [];
      return roles.some(function (role) { return ALLOWED_ROLES.indexOf(role) !== -1; });
    }

    // This page is served in place of any private URL, so reloading shows the
    // page that was asked for. On /login itself, go to the home page instead.
    function enter(user) {
      if (!hasAccess(user)) {
        show("noAccess", "No access yet", "You're signed in as " + user.email + ", but this account hasn't been given access. Contact PawPeer support.");
        return;
      }
      say("Signed in. Loading…");
      var path = location.pathname.replace(/\/$/, "");
      if (path === "/login" || path === "/login.html") location.replace("/");
      else location.replace(location.pathname + location.search);
    }

    function explain(error) {
      if (error instanceof MissingIdentityError) return "Sign-in isn't available right now. Please try again later.";
      if (error instanceof AuthError) {
        if (error.status === 401 || error.status === 400) return "Incorrect email or password.";
        if (error.status === 422) return "Please check what you entered. Passwords need at least 8 characters.";
        return error.message;
      }
      return "Something went wrong. Please try again.";
    }

    async function busy(form, task) {
      var button = form.querySelector("button[type=submit]");
      button.disabled = true;
      say("");
      try { await task(); }
      catch (error) { say(explain(error), true); }
      finally { button.disabled = false; }
    }

    forms.login.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(forms.login, async function () {
        var user = await login(forms.login.email.value.trim(), forms.login.password.value);
        enter(user);
      });
    });

    forms.forgot.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(forms.forgot, async function () {
        await requestPasswordRecovery(forms.forgot.email.value.trim());
        say("If that email has an account, a reset link is on its way.");
      });
    });

    forms.password.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(forms.password, async function () {
        var password = forms.password.password.value;
        var user = inviteToken ? await acceptInvite(inviteToken, password) : await updateUser({ password: password });
        enter(user);
      });
    });

    forms.noAccess.addEventListener("submit", function (e) {
      e.preventDefault();
      busy(forms.noAccess, async function () {
        await logout();
        show("login", "Sign in to PawPeer", "This site is private. Sign in with the account you were invited with.");
      });
    });

    document.getElementById("show-forgot").addEventListener("click", function () {
      show("forgot", "Reset your password", "Enter your email and we'll send you a link to choose a new password.");
      say("");
    });
    document.getElementById("show-login").addEventListener("click", function () {
      show("login", "Sign in to PawPeer", "This site is private. Sign in with the account you were invited with.");
      say("");
    });

    async function start() {
      try {
        // Links from invite, password reset and confirmation emails.
        var result = await handleAuthCallback();
        if (result) {
          if (result.type === "invite") {
            inviteToken = result.token;
            show("password", "Welcome to PawPeer", "Choose a password to finish setting up your account.");
            return;
          }
          if (result.type === "recovery") {
            show("password", "Choose a new password", "Enter a new password for " + result.user.email + ".");
            return;
          }
          if (result.user) { enter(result.user); return; }
        }
      } catch (error) {
        say("That link is invalid or has expired. Sign in below or request a new link.", true);
        return;
      }

      // A returning member whose 1-hour sign-in token expired: renew it and
      // reload. Throttled so a stale session can't cause a reload loop.
      var lastReload = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
      if (Date.now() - lastReload < 30000) return;
      await refreshSession();
      var user = await getUser();
      if (user && hasAccess(user)) {
        sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
        enter(user);
      }
    }

    start();
  </script>
</body>
</html>
