<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join PawPeer 🐾</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1116; color: #f5f5f7; padding: 24px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { opacity: .8; margin: 4px 0 24px; max-width: 30rem; line-height: 1.5; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .15em; font-size: 1.25rem; padding: 8px 16px;
      border: 1px dashed #444; border-radius: 10px; margin-bottom: 24px;
    }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600;
      background: #4f8cff; color: #fff; padding: 14px 28px; border-radius: 999px;
      font-size: 1.05rem;
    }
    .paw { font-size: 3rem; margin-bottom: 8px; }
    small { display:block; margin-top: 20px; opacity:.55; }
  </style>
</head>
<body>
  <div class="paw">🐾</div>
  <h1>You've been invited to PawPeer</h1>
  <p>Get the app and your invite is applied automatically. Once you pick a
     membership plan, you and your friend each earn 25 PawPoints.</p>
  <div class="code" id="code">…</div>
  <a class="btn" id="cta" href="#">Get the app</a>
  <small id="hint">Redirecting you to the store…</small>

  <script>
    // ---- Config -----------------------------------------------------------
    // TODO: replace with the real numeric App Store id once the iOS app is live
    // (e.g. https://apps.apple.com/app/id0000000000). Until then iOS users land
    // on the App Store search for "PawPeer".
    var IOS_STORE_URL = "https://apps.apple.com/app/idYOUR_APP_STORE_ID";
    var ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.pawpeer.app";
    var CLIPBOARD_PREFIX = "pawpeer-ref:";

    // ---- Extract referral code from /r/{code} -----------------------------
    var parts = location.pathname.split("/").filter(Boolean); // ["r", "CODE"]
    var code = (parts[1] || "").trim().toUpperCase();
    if (code) {
      document.getElementById("code").textContent = code;
    } else {
      document.getElementById("code").style.display = "none";
    }

    // ---- Platform detection ----------------------------------------------
    var ua = navigator.userAgent || "";
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    var storeUrl = isIOS ? IOS_STORE_URL : isAndroid ? ANDROID_STORE_URL : null;

    // ---- Deferred deep link: stash the code on the clipboard --------------
    // The app reads `pawpeer-ref:CODE` once on first launch after install.
    function copyCode() {
      if (!code || !navigator.clipboard) return Promise.resolve();
      return navigator.clipboard.writeText(CLIPBOARD_PREFIX + code).catch(function () {});
    }

    var cta = document.getElementById("cta");
    var hint = document.getElementById("hint");

    if (storeUrl) {
      cta.href = storeUrl;
      // Copy + go within the tap gesture (most reliable for clipboard perms).
      cta.addEventListener("click", function (e) {
        e.preventDefault();
        copyCode().then(function () { location.href = storeUrl; });
      });
      // Best-effort auto path: copy on load, then redirect shortly after so the
      // write has a chance to land before navigation.
      copyCode().then(function () {
        setTimeout(function () { location.href = storeUrl; }, 900);
      });
    } else {
      // Desktop / unknown — no auto redirect; offer both stores.
      cta.textContent = "Open on your phone";
      cta.href = "#";
      hint.innerHTML =
        'Open this link on your phone to install PawPeer. ' +
        '<br><a style="color:#4f8cff" href="' + IOS_STORE_URL + '">iPhone</a> · ' +
        '<a style="color:#4f8cff" href="' + ANDROID_STORE_URL + '">Android</a>';
      copyCode();
    }
  </script>
</body>
</html>
