<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PawPeer — Smart Pet Care for Busy Lives</title>

  <!-- Theme color for address bar -->
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pp-red: #b72c3c;
      --text: #222;
      --muted: #333;
      --bg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --pp-red: #ff6b6b;
        --text: #f1f1f1;
        --muted: #ccc;
        --bg: #121212;
      }
    }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      color-scheme: light dark;
      transition: background .25s ease, color .25s ease;
    }

    /* Centered container keeps layout tidy on desktop */
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    /* Logo container for dark mode badge */
    .logo-badge {
      width: 112px;
      height: 112px;
      margin: 0 auto 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: transparent;
    }
    .logo-badge img.logo {
      width: 92px;
      height: auto;
      display: block;
    }
    @media (prefers-color-scheme: dark) {
      .logo-badge {
        background: #fff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.25),
          0 0 0 6px rgba(255, 255, 255, 0.08);
      }
      .logo-badge img.logo {
        filter: contrast(1.05) saturate(1.02);
      }
    }

    h1 {
      font-weight: 800;
      line-height: 1.25;
      color: var(--pp-red);
      font-size: clamp(1.35rem, 2.2vw + 1rem, 2.1rem);
      margin: 0 auto 14px;
      max-width: 26ch;
      letter-spacing: -0.01em;
    }
    p.lead {
      color: var(--muted);
      font-size: clamp(0.98rem, 0.4vw + 0.9rem, 1.08rem);
      margin: 0 auto 28px;
      max-width: 38ch;
    }

    /* Store buttons: center on both column and row layouts */
    .store-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;     /* <-- critical fix */
      gap: 14px;
      margin: 10px auto 40px;
      width: 100%;
    }
    @media (min-width: 480px) {
      .store-buttons {
        flex-direction: row;
        gap: 20px;
        justify-content: center;   /* <-- keep centered on desktop */
      }
    }
    .store-buttons a {
      display: inline-flex;        /* defensive against global CSS */
    }
    .store-buttons img {
      height: 56px;
      width: auto;
      display: block;
      transition: transform 0.18s ease;
    }
    .store-buttons a:hover img { transform: scale(1.04); }

    .verify {
      font-size: 1rem;
      color: var(--muted);
    }
    footer {
      margin-top: 52px;
      font-size: 0.9rem;
      color: var(--muted);
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Logo with dark mode support -->
    <div class="logo-badge">
      <img
        class="logo"
        src="https://ycznptyvhycsqilipohz.supabase.co/storage/v1/object/public/assets/pawpeer_logo_latest.png"
        alt="PawPeer Logo"
      />
    </div>

    <h1>Welcome to PawPeer — Smart Pet Care for Busy Lives.</h1>
    <p class="lead">Find trusted neighbors to walk and sit your pet — sometimes for free!</p>

    <!-- Official App Store / Play Store badges -->
    <div class="store-buttons">
      <a href="https://apps.apple.com" target="_blank" rel="noopener">
        <img
          src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
          alt="Download on the App Store">
      </a>
      <a href="https://play.google.com/store" target="_blank" rel="noopener">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
          alt="Get it on Google Play">
      </a>
    </div>

    <div class="verify" id="verify-content" style="display:none;">
      <h3>Verifying your email…</h3>
      <p>You’ll be redirected to the PawPeer app shortly.</p>
    </div>

    <footer>pawpeer.io</footer>
  </main>

  <script>
    // Show verification text and redirect if token present
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (token) {
      document.getElementById('verify-content').style.display = 'block';
      location.replace(`pawpeer://verify-email?token=${encodeURIComponent(token)}`);
    }
  </script>
</body>
</html>
