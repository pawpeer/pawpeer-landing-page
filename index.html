<style>
  /* add this small polish so the verify block fades in when revealed */
  .verify.revealed {
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
  }
</style>

<!-- …inside the end of <body> -->
<script>
  // Show "Verifying…" first, then deep-link after a short delay so it's visible on fast desktops.
  (function () {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) return;

    const verifyEl = document.getElementById('verify-content');
    if (verifyEl) {
      verifyEl.style.display = 'block';
      verifyEl.classList.add('revealed');
    }

    const DEEPLINK = `pawpeer://verify-email?token=${encodeURIComponent(token)}`;
    const SHOW_MS  = 1000;   // wait so users can SEE the verifying text/animation
    const HINT_MS  = 2500;   // after this, show a manual open link if nothing happened

    setTimeout(() => {
      // Attempt deep link (use href to avoid replacing history until OS handles scheme)
      window.location.href = DEEPLINK;
    }, SHOW_MS);

    // Optional UX: if the scheme didn’t open, append a manual link
    setTimeout(() => {
      if (!verifyEl) return;
      // Avoid duplicating if user already left the page
      const manual = document.createElement('p');
      manual.style.marginTop = '12px';
      manual.innerHTML = `If nothing happens, <a href="${DEEPLINK}">click here to open the app</a>.`;
      verifyEl.appendChild(manual);
    }, HINT_MS);
  })();
</script>
